version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.9 /usr/local/share/virtualenvs/tap-autodesk-bim-360
            source /usr/local/share/virtualenvs/tap-autodesk-bim-360/bin/activate
            uv pip install -U 'pip<19.2' setuptools
            uv pip install .[dev]
            uv pip install pylint
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_autodesk_bim_360/schemas/*.json
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-autodesk-bim-360/bin/activate
            pylint tap_autodesk_bim_360 --disable 'broad-except,chained-comparison,empty-docstring,fixme,invalid-name,line-too-long,missing-class-docstring,missing-function-docstring,missing-module-docstring,no-else-raise,no-else-return,too-few-public-methods,too-many-arguments,too-many-branches,too-many-lines,too-many-locals,ungrouped-imports,wrong-spelling-in-comment,wrong-spelling-in-docstring,bad-whitespace,trailing-whitespace,inconsistent-return-statements,global-variable-not-assigned,unspecified-encoding,unused-variable,too-many-positional-arguments,logging-format-interpolation,consider-using-f-string,possibly-used-before-assignment,useless-option-value,raise-missing-from,broad-exception-raised,unused-argument,redefined-builtin,useless-object-inheritance,too-many-instance-attributes,dangerous-default-value,deprecated-method'

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
